  <title>Contact | My Wallpaper Designs</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Get in touch for custom wallpaper requests, questions or collaborations.">

<body>

  <div id="header-placeholder"></div>

  <main>
   <main>
  <section class="text-page">
    <h1>Contact</h1>
    <p>Want a custom wallpaper, or have a question? Send me a message and I'll reply as soon as I can.</p>

    <form class="contact-form" action="https://formspree.io/f/xjygoeno" method="post">
      <input type="hidden" name="_next" value="https://yourdomain.com/thank-you.html">

      <div>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div>
        <label for="email">Your email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button class="button" type="submit">Send message</button>

    </form>

    <p>Prefer email? Write to <a href="mailto:tasneembasem10@gmail.com">tasneembasem10@gmail.com</a>.</p>
  </section>
